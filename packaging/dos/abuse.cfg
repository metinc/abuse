# DOSBox defaults. This file uses TOML syntax and an 8.3-compatible filename.
schema_version = 8

[video]
fullscreen = true
widescreen_support = false
framebuffer_width = 320
framebuffer_height = 200
window_scale = 2
linear_filter = false

[audio]
sound_enabled = true
music_enabled = true
soundfont = ""

[gameplay]
max_fps = 30
record_replays = false

[general]
language = "english"

[input.gamepad]
enabled = false
