# Run from the packaged game directory: dosbox -conf dosbox.cfg
[sdl]
fullscreen=false
output=surface

[dosbox]
machine=svga_s3
memsize=63

[cpu]
core=dynamic
cycles=max

[render]
aspect=true

[sblaster]
sbtype=sb16
sbbase=220
irq=7
dma=1
hdma=5
oplmode=opl3

[midi]
mpu401=none

[autoexec]
mount c .
c:
abuse.exe
exit
